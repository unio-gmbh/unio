<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden | UNIO</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">
<meta name="theme-color" content="#F7F5F1">
<style>
  html,body{height:100%;}
  body{background:var(--paper);color:var(--ink-2);display:flex;flex-direction:column;}
  .top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:26px clamp(20px,5vw,48px);}
  .top img{height:17px;display:block;}
  .top .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);}
  .shell{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:860px;margin:0 auto;padding:40px 24px 80px;text-align:center;width:100%;}
  .code{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--signal-deep);}
  h1{font:500 clamp(40px,7vw,88px)/1.02 var(--font-display);letter-spacing:-.035em;color:var(--ink);margin:18px 0 0;}
  h1 .p{color:var(--signal);}
  .lead{font:400 clamp(16px,1.6vw,18.5px)/1.65 var(--font-display);color:var(--text-muted);margin:22px auto 0;max-width:460px;}
  .links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:36px;}
  .links a{font:500 14.5px var(--font-display);text-decoration:none;padding:13px 24px;border-radius:999px;color:var(--ink);
    box-shadow:inset 0 0 0 1px var(--hairline-dark);background:var(--surface-raised);transition:transform .3s var(--ease-unio);}
  .links a:hover{transform:translateY(-2px);}
  .links a.primary{background:var(--signal);color:var(--on-signal);box-shadow:none;}
  .grid{position:fixed;inset:0;pointer-events:none;display:flex;justify-content:space-evenly;opacity:.5;}
  .grid i{width:1px;background:rgba(11,10,9,.05);}
  .foot{padding:24px 6vw;display:flex;gap:22px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-top:1px solid var(--hairline-dark);}
  .foot a{font:400 13px var(--font-display);color:var(--text-muted);text-decoration:none;}
  @media(prefers-reduced-motion:reduce){.links a{transition:none;}}
</style>
</head>
<body>
<div class="grid" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div class="top">
  <a href="/"><img src="/assets/logo/unio-logo-black.svg" alt="UNIO"></a>
  <span class="lbl">Fehler&nbsp;&middot;&nbsp;404</span>
</div>
<main class="shell">
  <span class="code">404&nbsp;&middot;&nbsp;Nicht gefunden</span>
  <h1>Diese Seite<br>gibt es nicht<span class="p">.</span></h1>
  <p class="lead">Vielleicht verschoben, vielleicht nie gebaut. Was es sicher gibt, findest du hier:</p>
  <div class="links">
    <a class="primary" href="/">Zur Startseite</a>
    <a href="/immobilien">Immobilien</a>
    <a href="/wissen">Wissen</a>
    <a href="/kontakt">Kontakt</a>
  </div>
</main>
<div class="foot">
  <img src="/assets/logo/unio-logo-black.svg" alt="UNIO" style="height:14px;">
  <span style="display:inline-flex;gap:22px;flex-wrap:wrap;">
    <a href="/impressum">Impressum</a><a href="/datenschutz">Datenschutz</a><a href="/agb">AGB</a>
    <span style="font:400 11px var(--font-mono);color:var(--text-muted);letter-spacing:.1em;">© 2026 UNIO · WIEN</span>
  </span>
</div>
</body>
</html>
