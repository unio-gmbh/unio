<!-- @dsCard group="Objektseite" viewport="390x844" name="Explore" subtitle="Vertikaler Immobilien-Feed — lernt aus Herzen und angesehenen Objekten" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explore — UNIO</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../../styles.css">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon/favicon-32.png">
<meta name="theme-color" content="#0B0A09">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
<style>
  :root{ --ink:#0B0A09; --paper:#F7F5F1; --orange:#FFAA09; --ease:cubic-bezier(.32,.72,0,1);}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;}
  body{background:#151312;font-family:var(--font-display),'Helvetica Neue',Helvetica,sans-serif;-webkit-font-smoothing:antialiased;color:var(--paper);overflow:hidden;}
  .mono{font-family:var(--font-mono),'SF Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;}

  /* Buehne: mobil vollflaechig, Desktop als zentrierte Phone-Buehne */
  .stage{position:fixed;inset:0;display:flex;justify-content:center;background:#151312;}
  .feedwrap{position:relative;width:100%;height:100%;max-width:none;}
  @media(min-width:768px){
    .feedwrap{max-width:520px;}
    .stage::before{content:'';position:absolute;inset:0;
      background:radial-gradient(60% 50% at 50% 20%, rgba(255,170,9,.07), transparent 70%);}
  }

  .feed{height:100%;overflow-y:scroll;scrollbar-width:none;overscroll-behavior:contain;}
  @media(pointer:coarse){.feed{scroll-snap-type:y mandatory;}} /* Snap nur auf Touch; Desktop scrollt frei */
  .feed::-webkit-scrollbar{display:none;}

  .card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#1B1917;}
  .card img,.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .card.aktiv img{animation:kenburns 9s var(--ease) forwards;}
  .card .info,.card .rail{opacity:0;transform:translateY(16px);transition:opacity .5s var(--ease) .1s,transform .6s var(--ease) .1s;}
  .card.aktiv .info,.card.aktiv .rail{opacity:1;transform:none;}
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
  .burst{position:absolute;left:50%;top:50%;z-index:6;pointer-events:none;color:var(--orange);
    transform:translate(-50%,-50%) scale(.4);opacity:0;filter:drop-shadow(0 6px 24px rgba(0,0,0,.4));}
  .burst.go{animation:burst .8s var(--ease) forwards;}
  @keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}55%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-56%) scale(1.05)}}
  @media(prefers-reduced-motion:reduce){.card.aktiv img{animation:none;}.burst.go{animation:none;opacity:0;}.card .info,.card .rail{opacity:1!important;transform:none!important;transition:none;}}
  .card .tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,9,.42) 0%,rgba(11,10,9,0) 26%,rgba(11,10,9,0) 52%,rgba(11,10,9,.72) 100%);}

  /* Info unten links */
  .info{position:absolute;left:18px;right:92px;bottom:calc(24px + env(safe-area-inset-bottom));}
  .info .why{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono),monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(247,245,241,.9);background:rgba(11,10,9,.42);border:1px solid rgba(247,245,241,.2);border-radius:99px;padding:6px 12px;margin-bottom:12px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  .info .why i{width:6px;height:6px;border-radius:50%;background:var(--orange);font-style:normal;}
  .info h2{font-size:clamp(26px,6.4vw,34px);font-weight:500;line-height:1.05;letter-spacing:-.025em;text-shadow:0 2px 26px rgba(0,0,0,.45);}
  .info .meta{margin-top:8px;font-family:var(--font-mono),monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(247,245,241,.85);}
  .info .preis{margin-top:10px;font-size:21px;font-weight:500;letter-spacing:-.01em;}
  .ekkarte{display:grid;place-items:center;background:radial-gradient(90% 70% at 50% 20%, rgba(255,170,9,.12), transparent 60%), #141210;}
  .ekkarte .ekinhalt{max-width:420px;padding:0 30px;text-align:center;}
  .ekkarte .ekkicker{font-family:var(--font-mono),monospace;font-size:9px;letter-spacing:.16em;color:var(--orange);}
  .ekkarte h2{font-size:clamp(28px,6vw,40px);font-weight:600;letter-spacing:-.02em;line-height:1.08;margin:14px 0 10px;}
  .ekkarte p{font-size:14.5px;line-height:1.6;color:rgba(247,245,241,.72);margin:0 0 22px;}
  .ekkarte .ekbtn{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#1A1305;border:none;cursor:pointer;
    border-radius:99px;padding:13px 24px;font:700 14px/1 inherit;font-family:inherit;text-decoration:none;}
  .info .rchip{display:inline-flex;margin-top:9px;font-family:var(--font-mono),monospace;font-size:8.5px;letter-spacing:.13em;
    color:var(--orange);background:rgba(255,170,9,.14);border:1px solid rgba(255,170,9,.35);border-radius:99px;padding:5px 10px;}
  .info .more{display:inline-flex;align-items:center;gap:8px;margin-top:16px;text-decoration:none;color:#1A1305;background:var(--orange);
    font-size:13.5px;font-weight:600;border-radius:99px;padding:11px 20px;}

  /* Aktionen rechts */
  .rail{position:absolute;right:14px;bottom:calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;align-items:center;}
  .rail button,.rail a{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;text-decoration:none;
    background:rgba(11,10,9,.42);border:1px solid rgba(247,245,241,.22);color:var(--paper);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .25s var(--ease);}
  .rail button:active{transform:scale(.9);}
  .rail .lbl{font-family:var(--font-mono),monospace;font-size:8px;letter-spacing:.1em;color:rgba(247,245,241,.7);margin-top:-8px;text-transform:uppercase;}
  .rail .herz.on{background:var(--orange);border-color:var(--orange);color:#1A1305;}
  .rail .herz svg{transition:transform .3s var(--ease);}
  .rail .herz.on svg{transform:scale(1.15);}

  /* Topbar */
  .topbar{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;
    padding:calc(14px + env(safe-area-inset-top)) 18px 12px;}
  .topbar img{height:15px;display:block;}
  .topbar .mono{color:rgba(247,245,241,.85);}
  .topbar a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:8px;}
  .topbar .avapill{background:var(--orange)!important;color:#1A1305!important;border-color:transparent!important;
    font-weight:700;min-width:34px;text-align:center;}
  .topbar .hub{font-family:var(--font-mono),monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(247,245,241,.75);
    border:1px solid rgba(247,245,241,.25);border-radius:99px;padding:6px 12px;background:rgba(11,10,9,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}

  /* Bottom-Tabbar: Entdecken (Grid) / Feed */
  .tabbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:9;
    display:flex;gap:4px;padding:5px;border-radius:99px;background:rgba(11,10,9,.62);border:1px solid rgba(247,245,241,.18);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
  .tabbar button{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-family:inherit;
    font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:99px;background:transparent;color:rgba(247,245,241,.7);transition:all .25s var(--ease);}
  .tabbar button.on{background:var(--orange);color:#1A1305;}

  /* Grid-Ansicht (Instagram-Explore) */
  .grid{display:none;height:100%;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;
    padding:calc(56px + env(safe-area-inset-top)) 2px calc(86px + env(safe-area-inset-bottom));}
  .grid::-webkit-scrollbar{display:none;}
  .gwrap{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:calc((min(100vw,520px) - 8px)/3);gap:2px;grid-auto-flow:dense;}
  .gtile{position:relative;overflow:hidden;border:none;padding:0;cursor:pointer;background:#1B1917;}
  .gtile img,.gtile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .gtile.reel{grid-row:span 2;}
  .gtile .gbadge{position:absolute;right:7px;top:7px;color:#fff;filter:drop-shadow(0 1px 6px rgba(0,0,0,.5));}
  .gtile .gherz{position:absolute;left:7px;bottom:7px;display:inline-flex;align-items:center;gap:5px;color:#fff;
    font-family:var(--font-mono),monospace;font-size:9px;letter-spacing:.08em;filter:drop-shadow(0 1px 6px rgba(0,0,0,.6));opacity:0;transition:opacity .25s;}
  .gtile:hover .gherz,.gtile.geliked .gherz{opacity:1;}
  .gtile .gscrim{position:absolute;inset:0;background:linear-gradient(180deg,transparent 62%,rgba(11,10,9,.5));opacity:0;transition:opacity .25s;}
  .gtile:hover .gscrim{opacity:1;}
  @media(pointer:coarse){.gtile .gscrim{opacity:.5;}}

  /* Feed-Inhalte ueber der Tabbar */
  .info{bottom:calc(78px + env(safe-area-inset-bottom))!important;}
  .rail{bottom:calc(84px + env(safe-area-inset-bottom))!important;}

  /* Liste + Karte: hell, angelehnt an den Dashboard-Look (Paper, weisse Karten) */
  .such{display:none;height:100%;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;
    background:#F2EFE9;color:#141210;
    padding:calc(54px + env(safe-area-inset-top)) 0 calc(86px + env(safe-area-inset-bottom));}
  .such::-webkit-scrollbar{display:none;}
  .smap{position:sticky;top:0;z-index:3;height:40svh;min-height:260px;margin:0 10px;border-radius:18px;overflow:hidden;
    border:1px solid rgba(20,18,16,.12);background:#EDEBE6;box-shadow:0 18px 44px -24px rgba(20,18,16,.35);}
  .smap .leaflet-container{width:100%;height:100%;background:#EDEBE6;font-family:inherit;}
  .u-xpin{display:block;width:14px;height:14px;border-radius:50%;background:var(--orange);
    box-shadow:0 0 0 2px #FFFFFF,0 2px 8px rgba(20,18,16,.35);transition:transform .25s var(--ease);}
  .u-xpin.on{transform:scale(1.5);box-shadow:0 0 0 2px #FFFFFF,0 0 0 6px rgba(255,170,9,.3),0 2px 10px rgba(20,18,16,.4);}
  .leaflet-control-attribution{background:rgba(247,245,241,.75)!important;color:rgba(20,18,16,.5)!important;font-size:8px!important;}
  .leaflet-control-attribution a{color:rgba(20,18,16,.65)!important;}
  .slist{padding:12px 10px 0;display:flex;flex-direction:column;gap:8px;}
  .srow{display:grid;grid-template-columns:84px 1fr auto;gap:13px;align-items:center;text-align:left;
    background:#FFFFFF;border:1px solid rgba(20,18,16,.1);border-radius:16px;padding:10px;cursor:pointer;
    color:#141210;font-family:inherit;transition:border-color .25s,transform .25s var(--ease),box-shadow .25s var(--ease);}
  .srow:hover{transform:translateY(-1px);box-shadow:0 14px 30px -18px rgba(20,18,16,.25);}
  .srow.on{border-color:rgba(255,170,9,.8);}
  .srow img{width:84px;height:66px;border-radius:11px;object-fit:cover;display:block;}
  .srow .t{font-size:15px;font-weight:500;letter-spacing:-.01em;color:#141210;}
  .srow .m{font-family:var(--font-mono),monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#A19A91;margin-top:4px;}
  .srow .p{font-size:13.5px;font-weight:500;color:#141210;margin-top:4px;}
  .srow .sherz{width:38px;height:38px;border-radius:50%;border:1px solid rgba(20,18,16,.18);background:transparent;color:#6E6862;
    display:grid;place-items:center;cursor:pointer;}
  .srow .sherz.on{background:var(--orange);border-color:var(--orange);color:#1A1305;}
  .srow .rbadge{display:inline-block;margin-left:7px;font-family:var(--font-mono),monospace;font-size:8px;letter-spacing:.1em;
    color:#B87400;background:rgba(255,170,9,.14);border:1px solid rgba(255,170,9,.4);border-radius:99px;padding:3px 8px;vertical-align:1px;}
  .srow.ueber{opacity:.55;}
  .such.traum .srow.ueber{opacity:1;}
  .srow .rbadge.budget{color:#8A5A00;background:rgba(20,18,16,.06);border-color:rgba(20,18,16,.18);}
  .such.traum .srow .rbadge.budget{display:none;}
  .sfilter{display:flex;gap:7px;flex-wrap:wrap;padding:12px 14px 0;}
  .sfilter button{font-family:inherit;font-size:12px;font-weight:600;padding:8px 14px;border-radius:99px;cursor:pointer;
    border:1px solid rgba(20,18,16,.15);background:#FFFFFF;color:#6E6862;transition:all .25s var(--ease);}
  .sfilter button.on{background:#141210;color:#F7F5F1;border-color:#141210;}
  .such .scount{padding:14px 14px 4px;font-family:var(--font-mono),monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#6E6862;}
  /* Topbar auf hellem Grund: dunkles Logo + dunkle Labels */
  .feedwrap.hell .topbar .mono{color:rgba(20,18,16,.7);}
  .feedwrap.hell .topbar .hub{color:rgba(20,18,16,.75);border-color:rgba(20,18,16,.22);background:rgba(255,255,255,.6);}

  /* Erst-Besuch-Hinweis */
  .hint{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:rgba(11,10,9,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:1;transition:opacity .5s var(--ease);}
  .hint.weg{opacity:0;pointer-events:none;}
  .hint .box{text-align:center;padding:0 34px;max-width:340px;}
  .hint .box .arrows{font-size:26px;color:var(--orange);animation:hop 1.6s var(--ease) infinite;}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .hint h3{font-size:24px;font-weight:500;letter-spacing:-.02em;margin-top:14px;}
  .hint p{margin-top:10px;font-size:14.5px;line-height:1.6;color:rgba(247,245,241,.8);}
  .hint button{margin-top:22px;border:none;cursor:pointer;border-radius:99px;padding:13px 26px;background:var(--orange);color:#1A1305;font-weight:600;font-size:14px;font-family:inherit;}

  /* Merk-Toast */
  .toast{position:absolute;pointer-events:none;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-8px);z-index:8;
    background:rgba(11,10,9,.75);border:1px solid rgba(247,245,241,.2);color:var(--paper);border-radius:99px;padding:9px 18px;
    font-size:12.5px;font-weight:500;opacity:0;transition:all .4s var(--ease);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;}
  .toast.zeig{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast b{color:var(--orange);font-weight:600;}

  .likesbtn{cursor:pointer;font-family:var(--font-mono),monospace;}
  .likesbtn b{color:var(--orange);font-weight:600;}

  /* Merkliste: dunkles Sheet von unten */
  .liste{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none;}
  .liste .lback{position:absolute;inset:0;background:rgba(11,10,9,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .4s var(--ease);}
  .liste.open{pointer-events:auto;}
  .liste.open .lback{opacity:1;}
  .liste .sheet{position:relative;max-height:76%;background:#1B1917;border-radius:22px 22px 0 0;border:1px solid rgba(247,245,241,.14);border-bottom:none;
    transform:translateY(104%);transition:transform .5s var(--ease);display:flex;flex-direction:column;overflow:hidden;}
  .liste.open .sheet{transform:translateY(0);}
  .liste .lhead{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px 14px;border-bottom:1px solid rgba(247,245,241,.1);}
  .liste .lhead .mono{color:rgba(247,245,241,.8);}
  .liste .lx{width:36px;height:36px;border-radius:50%;border:1px solid rgba(247,245,241,.22);background:rgba(247,245,241,.06);color:var(--paper);cursor:pointer;font-family:inherit;}
  .liste .lbody{overflow-y:auto;padding:10px 14px calc(20px + env(safe-area-inset-bottom));}
  .lrow{display:grid;grid-template-columns:64px 1fr auto;gap:13px;align-items:center;padding:10px 8px;border-radius:14px;}
  .lrow:hover{background:rgba(247,245,241,.05);}
  .lrow img{width:64px;height:64px;border-radius:12px;object-fit:cover;}
  .lrow .t{font-size:15px;font-weight:500;letter-spacing:-.01em;}
  .lrow .m{font-family:var(--font-mono),monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(247,245,241,.6);margin-top:4px;}
  .lrow .p{font-size:13px;font-weight:500;color:rgba(247,245,241,.9);margin-top:3px;}
  .lrow .acts{display:flex;gap:8px;align-items:center;}
  .lrow .acts a{font-size:12.5px;font-weight:600;color:#1A1305;background:var(--orange);border-radius:99px;padding:8px 14px;text-decoration:none;white-space:nowrap;}
  .lrow .acts button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(247,245,241,.22);background:transparent;color:var(--orange);cursor:pointer;display:grid;place-items:center;}
  .lleer{padding:44px 24px;text-align:center;color:rgba(247,245,241,.7);font-size:14.5px;line-height:1.6;}
  .lfoot{padding:0 20px 14px;font-family:var(--font-mono),monospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(247,245,241,.45);text-align:center;}

  @media(prefers-reduced-motion:reduce){.hint .box .arrows{animation:none;}.rail button,.toast{transition:none;}.liste .sheet,.liste .lback{transition:none;}}
</style>
</head>
<body>
<div class="stage">
  <div class="feedwrap">
    <div class="topbar">
      <a href="/ux"><img src="../../assets/logo/unio-logo-white.svg" alt="UNIO"></a>
      <span class="mono">EXPLORE · <span id="posZaehler" style="color:var(--orange)">01</span></span>
      <span style="display:inline-flex;gap:8px;align-items:center;">
        <button class="hub likesbtn" id="likesBtn" type="button" aria-label="Merkliste öffnen">♥ <b id="likesCount">0</b></button>
        <a class="hub" href="/ux">UX-HUB</a>
        <a class="hub avapill" href="/ux/backend?rolle=endkunde" aria-label="Mein Portal">VH</a>
      </span>
    </div>
    <div class="feed" id="feed"></div>
    <div class="grid" id="grid"><div class="gwrap" id="gwrap"></div></div>
    <div class="such" id="such">
      <div class="smap" id="suchMap"></div>
      <div class="sfilter" id="suchFilter" role="group" aria-label="Suchparameter">
        <button data-f="alle" class="on">Alle</button>
        <button data-f="r3">Rendite ≥ 3 %</button>
        <button data-f="r35">Rendite ≥ 3,5 %</button>
        <button data-f="u15">bis € 1,5 Mio</button>
        <button data-f="traum" id="traumChip" style="display:none">Träumen ✨</button>
      </div>
      <div class="scount" id="suchCount"></div>
      <div class="slist" id="slist"></div>
    </div>
    <div class="tabbar" role="tablist" aria-label="Ansicht">
      <button id="tabGrid" role="tab" aria-selected="false"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1" y="1" width="5.6" height="5.6" rx="1"/><rect x="9.4" y="1" width="5.6" height="5.6" rx="1"/><rect x="1" y="9.4" width="5.6" height="5.6" rx="1"/><rect x="9.4" y="9.4" width="5.6" height="5.6" rx="1"/></svg>Entdecken</button>
      <button id="tabFeed" role="tab" aria-selected="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="1.5" width="11" height="13" rx="2"/><path d="m7 5.5 3.5 2.5L7 10.5z" fill="currentColor" stroke="none"/></svg>Feed</button>
      <button id="tabSuch" role="tab" aria-selected="false"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 14.5s-4.8-4.2-4.8-8a4.8 4.8 0 1 1 9.6 0c0 3.8-4.8 8-4.8 8z"/><circle cx="8" cy="6.3" r="1.7"/></svg>Liste</button>
    </div>
    <div class="toast" id="toast"></div>
    <div class="liste" id="liste" aria-hidden="true">
      <div class="lback" id="listeBack"></div>
      <div class="sheet" role="dialog" aria-label="Deine Merkliste">
        <div class="lhead">
          <span class="mono">DEINE MERKLISTE · <b id="listeCount" style="color:var(--orange)">0</b> OBJEKTE</span>
          <button class="lx" id="listeZu" aria-label="Schließen">✕</button>
        </div>
        <div class="lbody" id="listeBody"></div>

      gwrap.querySelectorAll("video").forEach(function(v){
        var r = v.getBoundingClientRect();
        if (r.bottom > 0 && r.top < innerHeight && !rm) { var pl = v.play(); if (pl && pl.catch) pl.catch(function(){}); }
      });
    } else if (welche === "feed") {
      gwrap.querySelectorAll("video").forEach(function(v){ v.pause(); });
      var akt = feed.querySelector(".card.aktiv video");
      if (akt && !rm) { var pl2 = akt.play(); if (pl2 && pl2.catch) pl2.catch(function(){}); }
    } else {
      gwrap.querySelectorAll("video").forEach(function(v){ v.pause(); });
      feed.querySelectorAll("video").forEach(function(v){ v.pause(); });
      bauSuche();
    }
    /* Listen-Tab ist hell: Topbar-Logo und Labels auf dunkel umschalten */
    var wrap = document.querySelector(".feedwrap");
    var logo = document.querySelector(".topbar img");
    wrap.classList.toggle("hell", welche === "such");
    logo.src = welche === "such" ? "../../assets/logo/unio-logo-black.svg" : "../../assets/logo/unio-logo-white.svg";
    localStorage.setItem("unio_explore_view", welche);
  }
  tabGrid.addEventListener("click", function(){ zeigeAnsicht("grid"); });
  tabFeed.addEventListener("click", function(){ zeigeAnsicht("feed"); });
  tabSuch.addEventListener("click", function(){ zeigeAnsicht("such"); });

  /* ---------- Liste + Karte (Leaflet, dunkle CARTO-Tiles) ---------- */
  var suchMap = null, suchMarker = {}, suchGebaut = false;
  function bauSuche(){
    var objekte = POOL.filter(function(o){ return o.ll; });
    if (!suchGebaut) {
      suchGebaut = true;
      document.getElementById("suchCount").textContent = objekte.length + " OBJEKTE · WIEN & UMGEBUNG";
      var slist = document.getElementById("slist");
      var w = tagGewichte();
      objekte.slice().sort(function(a, b){ return score(b, w) - score(a, w); }).forEach(function(o){
        var row = document.createElement("div");
        row.className = "srow"; row.dataset.id = o.id; row.setAttribute("role", "button"); row.tabIndex = 0;
        if (ueberBudget(o)) row.classList.add("ueber");
        row.innerHTML = '<img src="' + o.img + '" alt="" loading="lazy">' +
          '<div><div class="t">' + o.t + '</div><div class="m">' + o.ort + '</div><div class="p">' + o.preis +
          (ueberBudget(o) ? ' <span class="rbadge budget">ÜBER BUDGET</span>' : (rendite(o) ? ' <span class="rbadge">RENDITE ' + rendite(o) + ' %</span>' : '')) + '</div></div>' +
          '<button class="sherz' + (likes.has(o.id) ? " on" : "") + '" aria-label="Merken">' + HERZ.replace('width="22" height="22"', 'width="16" height="16"') + '</button>';
        row.addEventListener("click", function(e){
          if (e.target.closest(".sherz")) return;
          insFeed(o.id);
        });
        row.addEventListener("mouseenter", function(){ aktivPin(o.id, false); });
        row.querySelector(".sherz").addEventListener("click", function(){
          var on = this.classList.toggle("on");
          if (on) likes.add(o.id); else likes.delete(o.id);
          saveLikes(); zaehler();
          var h = feed.querySelector('.card[data-id="' + o.id + '"] .herz');
          if (h) h.classList.toggle("on", on);
        });
        slist.appendChild(row);
      });
    }
    if (!suchMap && window.L) {
      suchMap = L.map(document.getElementById("suchMap"), { scrollWheelZoom: false, zoomControl: false });
      L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" rel="noopener">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions" rel="noopener">CARTO</a>',
      }).addTo(suchMap);
      var pts = [];
      objekte.forEach(function(o){
        pts.push(o.ll);
        var icon = L.divIcon({ className: "", html: '<span class="u-xpin" data-pin="' + o.id + '"></span>', iconSize: [14, 14], iconAnchor: [7, 7] });
        var m = L.marker(o.ll, { icon: icon, title: o.t, keyboard: false }).addTo(suchMap);
        m.on("click", function(){
          aktivPin(o.id, true);
          var row = document.querySelector('.srow[data-id="' + o.id + '"]');
          if (row) row.scrollIntoView({ block: "center", behavior: rm ? "auto" : "smooth" });
        });
        suchMarker[o.id] = m;
      });
      suchMap.fitBounds(L.latLngBounds(pts).pad(0.2));
    }
    if (suchMap) setTimeout(function(){ suchMap.invalidateSize(); }, 60);
  }
  /* Suchparameter: filtern Zeilen und Pins gleichzeitig */
  if (ekProfil.kaufkraft) { var tc = document.getElementById("traumChip"); if (tc) tc.style.display = ""; }
  document.getElementById("suchFilter").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.f === "traum") {
      b.classList.toggle("on");
      document.querySelector(".such").classList.toggle("traum", b.classList.contains("on"));
      return;
    }
    this.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", x === b); });
    var f = b.dataset.f, sichtbar = 0;
    POOL.filter(function(o){ return o.ll; }).forEach(function(o){
      var r = o.mieteJahr && o.preisNum ? o.mieteJahr / o.preisNum * 100 : 0;
      var ok = f === "alle" || (f === "r3" && r >= 3) || (f === "r35" && r >= 3.5) || (f === "u15" && o.preisNum <= 1500000);
      var row = document.querySelector('.srow[data-id="' + o.id + '"]');
      if (row) row.style.display = ok ? "grid" : "none";
      var m = suchMarker[o.id];
      if (m) { var el = m.getElement(); if (el) el.style.display = ok ? "" : "none"; }
      if (ok) sichtbar++;
    });
    document.getElementById("suchCount").textContent = sichtbar + " OBJEKTE · WIEN & UMGEBUNG";
  });
  function aktivPin(id, mitZoom){
    document.querySelectorAll(".u-xpin").forEach(function(x){ x.classList.toggle("on", x.dataset.pin === id); });
    document.querySelectorAll(".srow").forEach(function(x){ x.classList.toggle("on", x.dataset.id === id); });
    if (mitZoom && suchMap) { var o = POOL.find(function(x){ return x.id === id; }); if (o) suchMap.panTo(o.ll); }
  }

  function insFeed(id){
    var o = POOL.find(function(x){ return x.id === id; });
    /* Erst die Feed-Ansicht einblenden, DANN positionieren: auf einem
       versteckten Element verpufft scrollTop und der Browser stellt beim
       Einblenden die alte Position wieder her (Klick zeigte falschen Beitrag). */
    zeigeAnsicht("feed");
    if (o) {
      var alte = feed.querySelector('.card[data-id="' + id + '"]');
      if (alte) feed.prepend(alte);
      else { geladen.add(id); feed.prepend(karte(o)); }
      feed.scrollTop = 0;
      requestAnimationFrame(function(){ feed.scrollTop = 0; });
    }
  }

  /* Grid fuellen: Reels als hohe Kacheln, Fotos als Quadrate, Reihenfolge nach
     Empfehlung. Endlos: am unteren Rand kommt die naechste, neu gemischte Runde.
     Videos spielen nur, wenn ihre Kachel sichtbar ist (Performance). */
  var gridIO = new IntersectionObserver(function(es){
    es.forEach(function(e){
      var v = e.target.querySelector("video");
      if (!v) return;
      if (e.isIntersecting && !rm && grid.style.display !== "none") { var pl = v.play(); if (pl && pl.catch) pl.catch(function(){}); }
      else v.pause();
    });
  }, { root: grid, threshold: 0.25 });
  function baueGridRunde(){
    var w = tagGewichte();
    var sortiert = POOL.slice().sort(function(a, b){ return score(b, w) - score(a, w); });
    sortiert.forEach(function(o){
      var tile = document.createElement("button");
      tile.className = "gtile" + (o.video ? " reel" : "") + (likes.has(o.id) ? " geliked" : "");
      tile.setAttribute("aria-label", o.t);
      tile.innerHTML =
        (o.video
          ? '<video src="' + o.video + '" poster="' + o.img + '" muted loop playsinline preload="metadata"></video>' +
            '<span class="gbadge"><svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 2.8v10.4c0 .6.7 1 1.2.7l8.2-5.2c.5-.3.5-1 0-1.3L5.7 2.1c-.5-.3-1.2.1-1.2.7z"/></svg></span>'
          : '<img src="' + o.img + '" alt="" loading="lazy">') +
        '<span class="gscrim"></span>' +
        '<span class="gherz">♥ ' + (likes.has(o.id) ? "Gemerkt" : o.t) + '</span>';
      tile.addEventListener("click", function(){ insFeed(o.id); });
      gwrap.appendChild(tile);
      gridIO.observe(tile);
    });
  }
  baueGridRunde();
  var gridLaedt = false;
  grid.addEventListener("scroll", function(){
    if (gridLaedt) return;
    if (grid.scrollTop + grid.clientHeight > grid.scrollHeight - 700) {
      gridLaedt = true;
      baueGridRunde();
      setTimeout(function(){ gridLaedt = false; }, 200);
    }
  }, { passive: true });

  /* Rueckkehr von der Objektseite: zuletzt gesehene Karte wieder nach oben, direkt im Feed */
  var pos = sessionStorage.getItem("unio_explore_pos");
  if (pos) {
    sessionStorage.removeItem("unio_explore_pos");
    var oPos = POOL.find(function(x){ return x.id === pos; });
    if (oPos) {
      var alte = feed.querySelector('.card[data-id="' + pos + '"]');
      if (alte) feed.prepend(alte);
      else { geladen.add(pos); feed.prepend(karte(oPos)); }
    }
    zeigeAnsicht("feed");
  } else {
    /* Einstieg wie bei Instagram: das Entdecken-Grid, ausser man war zuletzt im Feed */
    var merkView = localStorage.getItem("unio_explore_view");
    zeigeAnsicht(merkView === "feed" || merkView === "such" ? merkView : "grid");
  }
})();
</script>
</body>
